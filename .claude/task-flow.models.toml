# task-flow model configuration for THIS repository (project file).
# It is merged over the user file ~/.claude/task-flow/models.toml: a key set here wins,
# keys not set here come from the user file. No secrets: api_key_env is the NAME of an
# environment variable. Prices are USD per 1M tokens (docs.mistral.ai/inference/pricing,
# checked 2026-10-31). max_cost_usd is cumulative over one implement.py run, including
# every profile of the fallback chain.

[profiles.mistral-large]
driver = "openai-loop"
base_url = "https://api.mistral.ai/v1"
model = "mistral-large-4-0"
api_key_env = "MISTRAL_API_KEY"
billing = "api"
max_turns = 150
max_cost_usd = 2.00
price_input_per_mtok = 0.70
price_cached_input_per_mtok = 0.07
price_output_per_mtok = 2.10
fallback = ["mistral-small"]

[profiles.mistral-small]
driver = "openai-loop"
base_url = "https://api.mistral.ai/v1"
model = "mistral-small-2603"
api_key_env = "MISTRAL_API_KEY"
billing = "api"
max_turns = 150
max_cost_usd = 2.00
price_input_per_mtok = 0.15
price_cached_input_per_mtok = 0.015
price_output_per_mtok = 0.60

[profiles.glm-flash]
driver = "openai-loop"
base_url = "https://api.mistral.ai/v1"
model = "zai-glm-5-3-flash"
api_key_env = "MISTRAL_API_KEY"
billing = "api"
max_turns = 150
max_cost_usd = 2.00
price_input_per_mtok = 0.15
price_cached_input_per_mtok = 0.03
price_output_per_mtok = 0.50

[profiles.deepseek-flash]
driver = "openai-loop"
base_url = "https://api.mistral.ai/v1"
model = "deepseek-v4-1-flash-1017"
api_key_env = "MISTRAL_API_KEY"
billing = "api"
max_turns = 150
max_cost_usd = 2.00
price_input_per_mtok = 0.30
price_cached_input_per_mtok = 0.007
price_output_per_mtok = 1.20
fallback = ["mistral-large"]

# Codex through the CLI on the ChatGPT login (codex login). The reasoning effort comes from
# ~/.codex/config.toml. gpt-5.2-codex is not available on a ChatGPT account.
[profiles.codex]
driver = "cli"
model = "gpt-6.1-sol"
billing = "subscription"
command = ["codex", "exec", "--sandbox", "workspace-write", "--json", "--ephemeral", "-m", "gpt-6.1-sol", "-"]
usage_format = "codex-jsonl"
timeout_seconds = 1800

[roles]
implementer = "codex"
planner = "claude:sonnet"
backlog = "claude:sonnet"
checker = "script"
reviewer = "claude:sonnet"

