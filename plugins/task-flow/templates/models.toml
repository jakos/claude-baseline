[roles]
# One key per task-flow role. Each value is one of:
#   "claude"                  run the Claude subagent; its agent file's model frontmatter applies
#   "claude:opus|sonnet|haiku"  run the Claude subagent on that model, passed as the
#                             subagent call's model argument
#   a profile name            valid for planner, implementer, backlog and reviewer: planner runs
#                             scripts/role_run.py on it, implementer runs scripts/implement.py
#   "script"                  only valid for checker: run scripts/gates.py instead of the checker agent
# The implementer key also accepts a table form instead of the scalar:
#   [roles.implementer]
#   default = "codex"         # required enabled external profile; default-only preserves scalar behavior
# A scalar and a table never mix: whichever file (user or project) sets the key last
# replaces the other form entirely, and unknown keys inside the table are errors.
# Each key below is set to its agent's frontmatter default, so copying this file
# changes no model.
planner = "claude:opus"       # planner agent's frontmatter default: opus
implementer = "claude:sonnet" # implementer agent's frontmatter default: sonnet
checker = "claude:haiku"      # checker agent's frontmatter default: haiku
reviewer = "claude:opus"      # reviewer agent's frontmatter default: opus
backlog = "claude:opus"       # backlog agent's frontmatter default: opus

[gates]
reviewer_independence = "warn"           # warn, different-model or different-provider
command_timeout_seconds = 600           # per verification command run by scripts/gates.py (default 600)

# Opt-in plan routing, disabled in the shipped template. Remove the scalar
# implementer key before using [roles.implementer] in the same file.
# Tables merge by leaf across files; a scalar replaces the whole table (and vice versa).
# All targets must name enabled external profiles; profile-specific caps stay unchanged.
# Numeric illustration ONLY, uncalibrated: these are not recommended thresholds.
# [roles.implementer]
# default = "codex"
# [roles.implementer.bands]
# S = "codex"
# [roles.implementer.thresholds.S]
# steps = 2
# criteria = 2
