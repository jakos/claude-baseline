# task-flow models.toml — commented example. Copy it to one of:
#   ~/.claude/task-flow/models.toml            (user scope: every repository)
#   <repo-root>/.claude/task-flow.models.toml  (project scope: this repository only)
# The project file wins over the user file, key by key. Never put a secret in this
# file: api_key_env is the NAME of an environment variable, never the key itself.

[profiles.mistral]
# One example profile with every key. The model id is a placeholder; take a real
# one from GET /v1/models.
driver = "openai-loop"                  # "openai-loop", "anthropic-loop" or "cli" (required)
base_url = "https://api.mistral.ai/v1"  # http(s) URL; "/chat/completions" is appended on openai-loop, "/messages" on anthropic-loop (required)
model = "<model id from GET /v1/models>"  # model id string (required)
api_key_env = "MISTRAL_API_KEY"         # NAME of the env var holding the key; required unless billing = "local"
billing = "api"                         # "subscription", "api" or "local" (required)
max_turns = 60                          # completion requests allowed on this profile (default 60)
max_cost_usd = 10.0                     # cost cap over the whole run, all profiles together; omit for no limit
max_context = 200000                    # fail when a response reports more prompt tokens; omit for no limit
price_input_per_mtok = 0.0              # USD per 1M input tokens, for the cost figure (default 0)
price_cached_input_per_mtok = 0.0       # USD per 1M cached input tokens (default 0)
price_output_per_mtok = 0.0             # USD per 1M output tokens (default 0)
price_cache_write_per_mtok = 0.0        # USD per 1M prompt-cache-write tokens, anthropic-loop only (default: price_input_per_mtok)
fallback = []                           # other profiles to try, in order, when this one stays unavailable (default [])
enabled = true                          # false disables the profile (default true)
retries = 3                             # retries per request on 408, 429, 5xx, timeouts and connection errors (default 3)
retry_base_seconds = 2                  # exponential backoff base, seconds (default 2)
request_timeout_seconds = 300           # per request (default 300)
command_timeout_seconds = 600           # per run_command call (default 600)
temperature = 1.0                       # 0..2; omit for the provider's default; NOT allowed on anthropic-loop
max_output_tokens = 16384               # sent as max_tokens (openai-loop: under the max_tokens_param key); anthropic-loop sends max_tokens and defaults to 16000 when unset
max_tokens_param = "max_tokens"         # the body key max_output_tokens is sent under: "max_tokens" or "max_completion_tokens" (default "max_tokens"; only "max_tokens" on anthropic-loop)
extra_body = {}                         # table merged into the request body; reserved keys are per driver: openai-loop model, messages, tools, tool_choice; anthropic-loop also system, max_tokens, stream, temperature, top_p, top_k (default: none)
post_edit = []                         # commands run after each successful write_file/edit_file call; every "{path}" is replaced by the written file (worktree-relative, quoted); the exit code and output (max 40 lines) are appended to the tool result (default [])
prompt_extras = []                     # files whose contents are appended to the system prompt before the runner adapter; "~" is expanded, a relative path resolves against the repository root; a missing or unreadable file refuses the round (exit 2) (default [])

# An agent-CLI profile (driver = "cli"): the implementer round runs an installed agent
# CLI (e.g. Codex) instead of an HTTP API. The CLI owns its own tools and sandbox; the
# runner controls only the environment, the working directory, the deadline and the
# result capture (scripts/cli_driver.py). billing = "subscription" uses the CLI's saved
# login (codex login) and needs no api_key_env; billing = "api" needs one, passed through
# pass_env. A "cli" profile refuses the API-loop keys (base_url, max_turns, retries,
# temperature, extra_body, post_edit, ...) — the CLI's internal loop is not governed by
# them; its deadline is timeout_seconds. Only {worktree}, {prompt_file} and
# {last_message_file} are expanded in command, each argument on its own, with no shell.
# [profiles.codex]
# driver = "cli"
# model = "gpt-5.2-codex"               # metadata only: the -m argument below picks the model
# billing = "subscription"              # saved login; no api_key_env needed
# command = ["codex", "exec", "--sandbox", "workspace-write", "--json", "--ephemeral", "-m", "gpt-5.2-codex", "-"]
# read_only_command = ["codex", "exec", "--sandbox", "read-only", "--json", "-o", "{last_message_file}", "-"]
#                                     # separate from `command`: used instead of it by producer roles that must not write (planner, backlog and reviewer). Only a verified read-only argv passes — today `codex exec` with an explicit --sandbox read-only, no --full-auto / approval bypass / -c config override, and -o {last_message_file} so the host captures the final message. Required when this profile (or one of its fallbacks) serves a producer role; never inferred from the profile name (default: none)
# timeout_seconds = 600                 # the whole CLI run's deadline, seconds (default 600)
# prompt_via = "stdin"                   # "stdin" (default), "file" (requires {prompt_file} in command) or "arg" (prompt appended as one final argument)
# usage_format = "codex-jsonl"          # "codex-jsonl" sums turn.completed usage from stdout JSONL; "none" (default) leaves usage and cost unknown (null)
# pass_env = []                         # extra environment-variable NAMES passed to the CLI (default []); the runner allowlist applies first
# limit_patterns = []                   # regexes; a match on the bounded stderr/final output makes this attempt unavailable and tries the next fallback (default [])
# prompt_extras = []
# fallback = []
# enabled = true
# price_input_per_mtok = 0.0            # used for the cost figure only on billing = "api" with reported usage
# price_cached_input_per_mtok = 0.0
# price_output_per_mtok = 0.0

# The same CLI on an invocation-scoped API key instead of the saved login:
# [profiles.codex-api]
# driver = "cli"
# model = "gpt-5.2-codex"
# billing = "api"
# api_key_env = "CODEX_API_KEY"          # required with billing = "api" on driver "cli"
# pass_env = ["CODEX_API_KEY"]           # the key reaches the CLI; no other secret does
# command = ["codex", "exec", "--sandbox", "workspace-write", "--json", "--ephemeral", "-m", "gpt-5.2-codex", "-o", "{last_message_file}", "-"]
# usage_format = "codex-jsonl"
# timeout_seconds = 900

# A Claude profile on the native Messages API (prompt caching, cache-aware cost).
# Prices are USD per 1M tokens as of 2026-11-01; check the provider's pricing page.
# Never use ANTHROPIC_API_KEY here: in a Claude Code session that variable makes
# Claude Code itself bill by API token instead of the subscription.
# [profiles.claude-haiku]
# driver = "anthropic-loop"
# base_url = "https://api.anthropic.com/v1"
# model = "claude-haiku-5-5"
# api_key_env = "TASK_FLOW_ANTHROPIC_KEY"
# billing = "api"
# max_turns = 60
# max_cost_usd = 10.0
# max_context = 100000                    # Haiku 5.5 costs more above 100k prompt tokens per request; this fails the round instead of limiting it
# price_input_per_mtok = 0.10
# price_cached_input_per_mtok = 0.01
# price_output_per_mtok = 0.50
# price_cache_write_per_mtok = 0.125     # cache write, 5-minute TTL = 1.25x the input price
# fallback = []
# enabled = true
# retries = 3
# retry_base_seconds = 2
# request_timeout_seconds = 300
# command_timeout_seconds = 600
# # no temperature: the pinned API version rejects it on every model
# max_output_tokens = 16000
# max_tokens_param = "max_tokens"
# extra_body = {}

# Benchmark-only preset examples, in run priority order. All remain disabled.
# Documentation checked 2026-11-06; authenticated test: untested (ALL five).
# Read bench/README.md's tool/authentication matrix before enabling any preset.
# Pin an installed CLI build yourself; provenance records its actual --version and
# executable digest and refuses changed versions on resume/extension.
# benchmark_isolation is consumed only by bench.py with --cli-state-dir. It selects
# per-cell HOME/XDG/tool directories; ordinary implementer defaults are unchanged.
# benchmark_version_command is an optional argv override (default: tool --version).
# subscription_monthly_usd is optional contextual plan pricing, NEVER run spend.
# Never put credentials in command/config; provision auth by the documented route.

